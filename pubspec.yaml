name: alarm
description: "TRAC-GOLD RFID Inventory System - تطبيق إدارة المخزون الذهبي باستخدام RFID"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  # Bluetooth & RFID
  bluetooth_classic: ^0.0.4

  # Icons & UI
  font_awesome_flutter: ^10.7.0
  cupertino_icons: ^1.0.8

  # Network
  http: ^1.2.0
  dio: ^5.4.0

  # Images
  image_picker: ^1.0.7
  flutter_image_compress: ^2.3.0

  # Power / Device
  wakelock_plus: ^1.2.3

  # Files / Sharing
  share_plus: ^10.0.0
  open_filex: ^4.5.0
  path_provider: ^2.1.2
  path: ^1.9.0

  # Background Tasks
  workmanager: ^0.7.0

  # PDF
  pdf: ^3.10.7
  printing: ^5.13.1

  # URLs / App
  url_launcher: ^6.3.0
  restart_app: ^1.2.1

  # Local Storage
  shared_preferences: ^2.3.2

  # IDs
  uuid: ^4.5.0

  # QR / Barcode
  qr_flutter: ^4.1.0
  barcode_widget: ^2.0.3
  barcode: ^2.2.2

  # Charts
  fl_chart: ^0.66.0

  # Localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # State Management
  provider: ^6.1.2

  # Firebase - أحدث الإصدارات
  firebase_core: ^3.9.0
  firebase_auth: ^5.4.0
  cloud_firestore: ^5.6.0
  firebase_storage: ^12.4.0
  firebase_app_check: ^0.3.0

  # Google Sign-In
  google_sign_in: ^6.3.0
  device_preview: ^1.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # assets:
  #   - assets/gold.png
  #   - assets/icon/app_icon.jpeg

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.jpeg"

